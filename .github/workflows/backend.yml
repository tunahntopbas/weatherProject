name: Backend CI/CD

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
  workflow_dispatch: {}

jobs:
  build-test-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore backend/WeatherProject.sln

      - name: Build
        run: dotnet build backend/WeatherProject.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/WeatherProject.sln --configuration Release --no-build

      - name: Build Docker image
        run: docker build -t weatherproject-backend:latest ./backend

      - name: Import image into k3s containerd
        run: |
          docker tag weatherproject-backend:latest weather-backend:local
          docker save weather-backend:local | sudo k3s ctr images import -

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: /home/tunahntopbas/.kube/config
        run: |
          kubectl rollout restart deployment backend -n weather-app
          kubectl rollout status deployment backend -n weather-app --timeout=120s
