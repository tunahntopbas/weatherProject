name: Frontend CI/CD

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

jobs:
  build-test-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm test
        working-directory: frontend
        run: npm test
        timeout-minutes: 5
        env:
          CI: "true"

      - name: npm run build
        working-directory: frontend
        run: npm run build

      - name: Build Docker image
        run: docker build -t weatherproject-frontend:latest ./frontend

      - name: Import image into k3s containerd
        run: |
          docker tag weatherproject-frontend:latest weather-frontend:local
          docker save weather-frontend:local | sudo k3s ctr images import -

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: /home/tunahntopbas/.kube/config
        run: |
          kubectl rollout restart deployment frontend -n weather-app
          kubectl rollout status deployment frontend -n weather-app --timeout=120s
