# sadece backend/ altinda degisiklik oldugunda tetiklenir - frontend'e dokunan
# bir push bu pipeline'i gereksiz yere calistirmaz (frontend.yml ayri, kendi
# path filtresiyle)
trigger:
  branches:
    include:
      - master
  paths:
    include:
      - backend/*

pr: none

# self-hosted agent zorunlu: deploy hedefi (k3s, kubectl, docker) sadece bu
# makineden (weather-server) erisilebilir, Microsoft'un genel bulut agent'lari
# oraya ulasamaz
pool:
  name: Default

jobs:
  - job: build_test_deploy
    displayName: Build, Test, Deploy Backend
    steps:
      - checkout: self

      - script: dotnet restore backend/WeatherProject.sln
        displayName: Restore

      - script: dotnet build backend/WeatherProject.sln --configuration Release --no-restore
        displayName: Build

      - script: dotnet test backend/WeatherProject.sln --configuration Release --no-build
        displayName: Test

      # WEBSENSE_ROOT_CA: Pipeline > Edit > Variables altinda "secret" olarak eklenmeli.
      # Secret degerler YAML'a yazilamaz, sadece env eslemesiyle script'e aktarilir.
      - script: printf '%s' "$WEBSENSE_ROOT_CA" > backend/websense-root-ca.crt
        displayName: Write corporate root CA (not committed to repo)
        env:
          WEBSENSE_ROOT_CA: $(WEBSENSE_ROOT_CA)

      - script: docker build -t weatherproject-backend:latest ./backend
        displayName: Build Docker image

      # onceden "docker save | k3s ctr images import" ile image dogrudan agent'in
      # kendi node'unun local containerd deposuna atiliyordu - tek node'da sorun
      # yoktu ama 3 node'a gecince pod baska bir node'a dusunce image bulunamadi.
      # Simdi cluster ici registry'ye (k8s/registry/) push ediliyor, hangi node'a
      # dusersen dus oradan cekebiliyorsun.
      - script: |
          docker tag weatherproject-backend:latest 192.168.56.11:30500/weather-backend:latest
          docker push 192.168.56.11:30500/weather-backend:latest
        displayName: Push image to cluster registry

      # imagePullPolicy: Always oldugu icin ayni tag (latest) rollout restart'ta
      # yeniden cekilir. rollout status ise yeni pod gercekten hazir olana kadar
      # pipeline'i bekletir - bekletmezsek "deploy basarili" desek de pod hala
      # ayaga kalkmiyor olabilirdi
      - script: |
          kubectl rollout restart deployment backend -n weather-app
          kubectl rollout status deployment backend -n weather-app --timeout=120s
        displayName: Deploy to Kubernetes
        env:
          KUBECONFIG: /home/tunahntopbas/.kube/config
