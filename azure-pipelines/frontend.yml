# backend.yml ile ayni mantik: sadece frontend/ degisince tetiklensin diye
# ayri pipeline + path filtresi (ikisi tek pipeline olsaydi her degisiklikte
# ikisi de gereksiz yere calisirdi)
trigger:
  branches:
    include:
      - master
  paths:
    include:
      - frontend/*

pr: none

pool:
  name: Default

jobs:
  - job: build_test_deploy
    displayName: Build, Test, Deploy Frontend
    steps:
      - checkout: self

      - script: npm ci
        workingDirectory: frontend
        displayName: npm ci

      - script: npm test
        workingDirectory: frontend
        displayName: npm test
        timeoutInMinutes: 5
        env:
          CI: "true"

      - script: npm run build
        workingDirectory: frontend
        displayName: npm run build

      - script: docker build -t weatherproject-frontend:latest ./frontend
        displayName: Build Docker image

      # bkz. backend.yml'deki ayni adimin notu - image artik yerel node yerine
      # cluster ici registry'ye push ediliyor
      - script: |
          docker tag weatherproject-frontend:latest 192.168.56.11:30500/weather-frontend:latest
          docker push 192.168.56.11:30500/weather-frontend:latest
        displayName: Push image to cluster registry

      - script: |
          kubectl rollout restart deployment frontend -n weather-app
          kubectl rollout status deployment frontend -n weather-app --timeout=120s
        displayName: Deploy to Kubernetes
        env:
          KUBECONFIG: /home/tunahntopbas/.kube/config
