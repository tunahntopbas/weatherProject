# yerel gelistirme icin: "docker compose up" tek komutla tum bagimliklari
# (postgres, redis) + uygulamayi (backend, frontend) ayaga kaldirir. Kubernetes'in
# kucuk/tek makineli hali gibi dusunulebilir ama cluster/scheduler yok, tek host'ta calisir.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weatherproject
      POSTGRES_USER: weatherproject
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # backend'in "depends_on: condition: service_healthy" ile bekleyecegi kontrol -
    # postgres process'i baslamis olsa bile baglanti henuz kabul etmiyor olabilir,
    # pg_isready gercekten hazir mi diye soruyor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatherproject -d weatherproject"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=weatherproject;Username=weatherproject;Password=changeme"
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "5000:8080"
    # sadece process ayakta olmasi yetmiyor - postgres/redis gercekten baglanti
    # kabul edene kadar backend hic baslamiyor, yoksa ilk saniyelerde connection
    # refused hatasiyla crash loop'a girer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres-data:
