server {
    listen 80;

    # try_files ile $uri bulunamazsa index.html'e dusuluyor - Angular router
    # tarafi tum route'lari client-side yonetiyor (SPA), sunucunun her rota icin
    # ayri dosyasi yok, hepsi tek index.html'den JS ile calisiyor
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # frontend container'i /api/ altina gelen istekleri kendi icinde backend'e
    # yonlendiriyor (reverse proxy) - boylece tarayici sadece frontend'in adresini
    # bilir, backend'in adresini/portunu hic gormez, CORS derdi de olmaz
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
