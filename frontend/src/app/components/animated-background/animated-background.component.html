<!-- uc katman ust uste: foto (arka plan resmi), scrim (renk/karartma gecisi),
     particles (data-particle attribute'una gore scss'te farkli animasyon secilir) -->
<div class="scene">
  <div class="scene__photo" [style]="photoStyle()"></div>
  <div class="scene__scrim" [style]="scrimStyle()"></div>
  <div class="scene__particles" [attr.data-particle]="theme().particle"></div>
</div>
