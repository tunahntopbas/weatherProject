<div class="map-page">
  <header class="page-masthead">
    <p class="page-masthead__eyebrow">Turkiye</p>
    <h1 class="map-page__title">Harita</h1>
    <p class="page-masthead__hint">Bir ile tiklayin.</p>
  </header>

  <div class="map-page__body">
    <!-- gercek harita buraya component.ts'deki svgMarkup() ile ham SVG olarak
         basiliyor, click handler'i da yine component.ts'te (attachClickHandler) -->
    <div class="map-page__host" #mapHost [innerHTML]="svgMarkup()"></div>

    @if (activeCity(); as city) {
      <div class="map-page__panel">
        <div class="map-page__panel-header">
          <app-province-badge [cityName]="city" />
          <span class="map-page__panel-city">{{ city }}</span>
        </div>
        @if (activeTemp() !== null) {
          <div class="map-page__panel-stub" aria-hidden="true"></div>
          <span class="map-page__panel-temp">{{ activeTemp() | number: '1.0-0' }}°</span>
          <button type="button" class="map-page__panel-action" (click)="viewOnDashboard()">Anasayfada gor</button>
        } @else if (!errorMessage()) {
          <span class="map-page__panel-loading">Yukleniyor...</span>
        }
      </div>
    }
  </div>

  @if (errorMessage(); as msg) {
    <p class="map-page__error" role="alert">{{ msg }}</p>
  }
</div>
