<main class="dashboard">
  @if (forecast(); as f) {
    <div class="dashboard__grid">
      <app-weather-hero class="dashboard__hero" [forecast]="f" [theme]="theme()" />
      <div class="dashboard__rail">
        <app-forecast-strip [days]="f.daily" />
        <ng-container *ngTemplateOutlet="recentBlock" />
      </div>
    </div>
  } @else {
    <div class="dashboard__empty">
      <ng-container *ngTemplateOutlet="recentBlock" />
      @if (!errorMessage()) {
        <p class="dashboard__hint">Bir il secin, anlik hava durumunu ve haftalik tahmini gorun.</p>
      }
      @if (errorMessage(); as msg) {
        <p class="dashboard__error" role="alert">{{ msg }}</p>
      }
    </div>
  }
</main>

<ng-template #recentBlock>
  @if (recentSummaries().length > 0) {
    <div class="dashboard__recent">
      <p class="dashboard__recent-label">Son bakilanlar</p>
      <div class="dashboard__recent-grid">
        @for (summary of recentSummaries(); track summary.cityName) {
          <app-city-weather-card [summary]="summary" (select)="onCardSelected($event)" />
        }
      </div>
    </div>
  }
</ng-template>
