# Bu dosya ORNEK/SABLONDUR - gercek degerlerle doldurup "kubectl apply" ETME.
# Gercek secret, VM uzerinde .env dosyasindan OKUNARAK, imperative (komut satiri)
# yontemle olusturulacak - boylece gercek API anahtari hicbir zaman
# bu repo'ya / git'e yazilmaz. Asagidaki komut ile olusturulacak:
#
#   kubectl create secret generic weather-secret -n weather-app \
#     --from-literal=POSTGRES_PASSWORD=changeme \
#     --from-literal=ConnectionStrings__Postgres="Host=postgres;Port=5432;Database=weatherproject;Username=weatherproject;Password=changeme" \
#     --from-literal=OpenWeatherMap__ApiKey="$OPENWEATHERMAP_API_KEY"
#
apiVersion: v1
kind: Secret
metadata:
  name: weather-secret
  namespace: weather-app
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=weatherproject;Username=weatherproject;Password=REPLACE_ME"
  OpenWeatherMap__ApiKey: "REPLACE_ME"
