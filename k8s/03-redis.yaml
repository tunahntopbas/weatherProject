apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: weather-app
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Postgres'in aksine Deployment kullanildi: Redis burada sadece gecici cache
# (bkz. RedisWeatherCacheRepository), veri kaybolsa da sorun degil - kalici
# disk/StatefulSet gerektiren bir durum yok
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: weather-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 15
