apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: weather-app
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: weather-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # backend ile ayni sebep: image artik cluster ici registry'den cekiliyor,
          # tek node'a bagimli degil (bkz. 04-backend.yaml'daki notu)
          image: 192.168.56.11:30500/weather-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
# nip.io: gercek domain almadan, IP'yi adin icine gomup otomatik cozen ucretsiz
# DNS servisi. Iki host da ayni yere gidiyor - 127.0.0.1 versiyonu VM'in kendi
# icinden calisirken, gercek IP'li (192.168.56.11) versiyonu Windows host'tan
# tarayiciyla girerken kullaniliyor (127.0.0.1 versiyonu Windows'ta localhost'a
# cozulup VM'e degil kendi makineye gider, bu yuzden ikisine de ihtiyac var)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: weather-app
spec:
  ingressClassName: traefik
  rules:
    - host: weather.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: weather.192.168.56.11.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
