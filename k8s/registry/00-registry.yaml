# Cluster ici private Docker registry. Baslangicta yoktu - pipeline image'i
# "docker save | k3s ctr images import" ile dogrudan tek node'un local containerd
# deposuna atiyordu, bu da sadece tek node'lu kurulumda calisiyordu. 3 node'a
# gecince pod baska bir node'a dusunce image bulunamadi (ErrImageNeverPull).
# Cozum: image'lari burada merkezi bir yerde tutup her node'un oradan cekmesini
# saglamak - registry:2, Docker'in resmi minimal registry image'i.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-registry
  template:
    metadata:
      labels:
        app: docker-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          # TLS zorunlu: containerd, self-signed olsa bile duz HTTP registry'lere
          # varsayilan olarak guvenmiyor. Sertifika registry-tls secret'inda (asagida),
          # her 3 node'un guven deposuna ayrica eklenmesi gerekti (update-ca-certificates)
          env:
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /certs/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /certs/tls.key
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
            - name: registry-tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: registry-data
        - name: registry-tls
          secret:
            secretName: registry-tls
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
# NodePort secildi (ClusterIP degil) cunku her node'daki containerd, registry'ye
# cluster disindan bir adresle (192.168.56.11:30500) erisiyor - sadece cluster
# ici DNS ile calisan ClusterIP burada yetmez
apiVersion: v1
kind: Service
metadata:
  name: docker-registry
  namespace: registry
spec:
  type: NodePort
  selector:
    app: docker-registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
